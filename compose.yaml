services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: transport_logistics_php
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  nginx:
    image: nginx:stable-alpine
    container_name: transport_logistics_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  db:
    image: mysql:8.0
    container_name: transport_logistics_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: transport_logistics
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: transport_user
      MYSQL_PASSWORD: 123456
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
